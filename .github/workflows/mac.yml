name: macOS build

on:
  push:
    branches: [main]
    paths: ["Sources/**", "Resources/**", "build.sh", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["Sources/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log || {
            # Surface compiler errors as annotations on the run.
            grep -E "error:" build.log | head -40 | sed -E 's#^(/[^:]*/)?(Sources/[^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\2,line=\3,col=\4::\5#'
            exit 1
          }

      - name: PDF → Word smoke test
        run: |
          python3 -m pip install --quiet --break-system-packages reportlab pillow || python3 -m pip install --quiet reportlab pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from reportlab.lib.pagesizes import A4
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Image as RLImage, Table, ListFlowable, ListItem, PageBreak
          from reportlab.lib.styles import getSampleStyleSheet
          im = Image.new('RGB', (600, 300), (15, 25, 35)); ImageDraw.Draw(im).ellipse([220, 70, 380, 230], fill=(255, 70, 85)); im.save('pic.png')
          st = getSampleStyleSheet()
          SimpleDocTemplate('sample.pdf', pagesize=A4).build([
              Paragraph('Quarterly Report', st['Title']), Paragraph('1. Overview', st['Heading2']),
              Paragraph('This is <b>bold</b> and <font color="#cc0000">red</font> text that is long enough to wrap onto a second line so we can check joining. ' * 2, st['BodyText']),
              RLImage('pic.png', width=200, height=100),
              ListFlowable([ListItem(Paragraph('First item', st['BodyText'])), ListItem(Paragraph('Second item', st['BodyText']))], bulletType='bullet'),
              Table([['Name', 'Score'], ['Jett', '99'], ['Sage', '87']]), PageBreak(), Paragraph('Second page', st['Heading2'])])
          PY
          B=build.noindex/AgentWheel.app/Contents/MacOS/AgentWheel
          AGENTWHEEL_PDF_DEBUG=$PWD/pdf-debug.txt "$B" --run pdf.to.txt sample.pdf >/dev/null 2>&1 || true
          echo "::notice title=pdf debug::$(head -c 3000 pdf-debug.txt | tr '\n' '¶')"
          for id in pdf.to.docx pdf.to.md pdf.to.odt pdf.to.html pdf.to.rtf; do
            # PDFKit logs its own chatter to stderr; only stdout carries the result.
            out=$("$B" --run $id sample.pdf 2>/dev/null | tr '\n' ' ')
            echo "$out"
            if echo "$out" | grep -q "OK $id"; then echo "::notice title=$id::$out"; else echo "::error title=$id::$out"; failed=1; fi
          done
          echo "::notice title=sample.md::$(cat sample.md | tr '\n' '¶' | cut -c1-900)"
          echo "::notice title=sample.docx parts::$(unzip -l sample.docx | awk '{print $4}' | tr '\n' ' ')"
          textutil -convert txt -output docx.txt sample.docx && echo "::notice title=docx text::$(tr '\n' '¶' < docx.txt | cut -c1-600)"
          test -z "$failed"

      - name: Two-column PDF → Word
        run: |
          python3 - <<'PY'
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import BaseDocTemplate, Frame, PageTemplate, Paragraph, Spacer
          from reportlab.graphics.shapes import Drawing, Rect, String, Line
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_JUSTIFY
          from reportlab.lib import colors
          
          st = getSampleStyleSheet()
          body = ParagraphStyle('b', parent=st['BodyText'], fontName='Times-Roman', fontSize=10, leading=12, alignment=TA_JUSTIFY)
          head = ParagraphStyle('h', parent=body, fontName='Times-Bold', fontSize=11, spaceBefore=6)
          W, H = letter
          gap, margin = 18, 54
          colw = (W - 2 * margin - gap) / 2
          doc = BaseDocTemplate('twocol.pdf', pagesize=letter)
          doc.addPageTemplates([PageTemplate(frames=[
              Frame(margin, margin, colw, H - 2 * margin, id='l'),
              Frame(margin + colw + gap, margin, colw, H - 2 * margin, id='r')])])
          
          def chart():
              d = Drawing(colw, 110)
              d.add(Line(20, 15, 20, 105))
              d.add(Line(20, 15, colw - 10, 15))
              for i, v in enumerate([40, 75, 55, 90, 30]):
                  d.add(Rect(30 + i * 40, 15, 25, v, fillColor=colors.HexColor('#ff4655'), strokeColor=None))
                  d.add(String(34 + i * 40, 4, 'Q%d' % (i + 1), fontSize=7))
              return d
          
          text = ('Agents coordinate their utility usage across rounds, and the network learns to predict which '
                  'combination of abilities clears a site fastest while keeping teammates alive. ')
          story = []
          for section in range(1, 7):
              story.append(Paragraph('%d. Section %d' % (section, section), head))
              for k in range(3):
                  story.append(Paragraph(text * 4, body))
              if section == 2:
                  story.append(chart())
                  story.append(Paragraph('Fig. 1. Rounds won per quarter.', body))
          doc.build(story)
          PY
          B=build.noindex/AgentWheel.app/Contents/MacOS/AgentWheel
          out=$("$B" --run pdf.to.docx twocol.pdf 2>/dev/null | tr '\n' ' ')
          echo "$out"
          xml=$(unzip -p twocol.docx word/document.xml)
          cols=$(echo "$xml" | grep -o 'w:num="2"' | wc -l | tr -d ' ')
          justified=$(echo "$xml" | grep -o 'w:jc w:val="both"' | wc -l | tr -d ' ')
          images=$(unzip -l twocol.docx | grep -c 'word/media/' || true)
          echo "::notice title=twocol.docx::$out · two-column sections $cols · justified $justified · images $images"
          "$B" --run pdf.to.md twocol.pdf >/dev/null 2>&1 || true
          echo "::notice title=twocol.md::$(head -c 700 twocol.md | tr '\n' '¶')"
          test "$cols" -ge 1 && test "$images" -ge 1
