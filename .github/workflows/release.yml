name: macOS release

# Pushing a tag like v1.1.0 builds the universal Mac app in the cloud and publishes it as a Release.
# (The Windows build workflow attaches AgentWheel-Windows-x64.zip to the same Release.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要發佈到哪個 Release（例如 v1.1.0）"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./package.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: 特戰輪盤 ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/AgentWheel.dmg
            dist/AgentWheel.zip
